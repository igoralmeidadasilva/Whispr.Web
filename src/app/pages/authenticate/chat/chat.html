<div class="container p-3">
    <section class="justify-content-center bg-body-tertiary">
         <div class="p-3">
            <h1 class="display-6">Whispr :: Chat</h1>
        </div>

        <div class="row p-3">
            <div class="col">
                <span>Nome</span>
                <p class="">{{ userState?.name }}</p>
            </div>
        </div>

        <div class="row p-3 overflow-auto" #scrollContainer (scroll)="onScroll()" style="height: 60vh;">
            <div class="col">
                @if (isLoadingHistory()) {
                    <div class="d-flex justify-content-center p-2">
                        <div class="spinner-border spinner-border-sm text-success" role="status">
                            <span class="visually-hidden">Carregando...</span>
                        </div>
                    </div>
                }

                @for (message of messages(); track message.id) {
                    <app-message-bubble [message]="message" [userState]="userState!" (onAttachmentClick)="handleOnAttachmentClick($event)" />
                }
            </div>
        </div>

        <div class="row row-cols-6 p-3">
            @if (selectedFiles.length > 0) {
                @for(file of this.selectedFiles; track file) {
                    <div class="col">
                        <strong>{{ file.name }}</strong>
                    </div>
                }
            }
        </div>

        <div class="row p-3">
            <form class="input-group input-group-sm" [formGroup]="sendMessageForm" (ngSubmit)="handleOnSubmit()" novalidate>
                <input
                    id="multiFileUpload"
                    class="visually-hidden"
                    type="file" 
                    multiple 
                    (change)="onFileSelected($event)"
                />

                <label 
                    for="multiFileUpload" 
                    class="btn btn-outline-success rounded-start-2"
                >
                    <i class="bi bi-paperclip fs-5"></i>
                </label>

                <input type="text" formControlName="message" class="form-control" />

                <button class="btn btn-outline-success" type="submit" [disabled]="isSubmiting()"> > </button>
            </form>
        </div>
    </section>
</div>

<app-modal-component #attachmentModal [size]="this.sizes.Xl"> 
    <app-modal-header [title]="this.selectedAttachment().fileName"/>

    <app-modal-body cssClass="d-flex justify-content-center align-items-center">
        <img [src]="this.selectedAttachment().sasUri">
    </app-modal-body>

</app-modal-component>
