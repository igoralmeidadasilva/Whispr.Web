<app-alert #alert
           [id]="this.id()"
           [cssClass]="this.cssClass()"
           [isDismissable]="true"
           [color]="this.parameters()!.color">
    <div class="d-flex align-items-start gap-2">
         <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>

         <div class="flex-grow-1">
            @if(this.parameters()!.problem !== "") {
                <p [class]="'fw-semibold small mb-0' + (this.hasErrors() ? ' mb-2' : '')"> {{ this.parameters()!.problem }}</p>
            }

            @if(this.hasErrors()) {
                <div class="d-flex flex-column gap-2">
                    @for(entry of parameters()!.errors | keyvalue; track entry.key) {
                        <div>
                            <p class="text-uppercase fw-semibold opacity-75 mb-1" style="font-size: 0.68rem; letter-spacing: 0.05em;">
                                {{ entry.key }}
                            </p>
                            <ul class="mb-0 ps-3 d-flex flex-column gap-0">
                                @for(error of entry.value; track error) {
                                    <li class="small">{{ error }}</li>
                                }
                            </ul>
                        </div>
                    }
                </div>
            }
         </div>
    </div>
</app-alert>
