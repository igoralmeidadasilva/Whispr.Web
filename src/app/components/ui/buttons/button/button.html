<button [type]="type()"
        [id]="id()"
        [class]="buildCssClass()"
        (click)="handleOnClick($event)"
        [disabled]="isLoadingOrDisabled()">

    @if(this.loading()) {
        <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>    
    }

    <ng-content />
</button>
